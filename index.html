<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Be Discipline</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <meta name="theme-color" content="#2f3bff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Instrument Sans"', 'system-ui', 'sans-serif'] }, colors: { accent: '#2f3bff' } } } }</script>
  <style>
    /* ── base ── */
    * {
      box-sizing: border-box
    }

    body {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent
    }

    :focus-visible {
      outline: 2px solid #2f3bff;
      outline-offset: 2px
    }

    .dark input,
    .dark select,
    .dark textarea {
      color-scheme: dark
    }

    /* ── mobile bottom nav ── */
    #mobile-nav {
      display: none
    }

    @media(max-width:767px) {
      body {
        padding-bottom: calc(60px + env(safe-area-inset-bottom))
      }

      #mobile-nav {
        display: flex
      }

      .fab {
        bottom: calc(70px + env(safe-area-inset-bottom)) !important;
        right: 1rem !important
      }

      /* shrink the app horizontal padding on tiny screens */
      #app {
        padding-left: .875rem !important;
        padding-right: .875rem !important
      }
    }

    /* ── mobile nav pills ── */
    #mobile-nav button {
      position: relative;
      transition: color .15s
    }

    #mobile-nav button.active-tab::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #2f3bff
    }

    .dark #mobile-nav button.active-tab::after {
      background: #8b93ff
    }

    /* ── category chips — wrap on small screens ── */
    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: 1rem;
      margin-bottom: .25rem;
      align-items: center
    }

    /* ── filter icon button (mobile only) ── */
    .filter-btn {
      display: none
    }

    @media(max-width:639px) {
      .filter-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: .35rem;
        padding: .3rem .625rem;
        font-size: .8125rem;
        font-weight: 600;
        border-radius: 9999px;
        border: 1.5px solid;
        cursor: pointer;
        white-space: nowrap;
        line-height: 1.4
      }

      .chips-wrap-full {
        display: none !important
      }
    }

    /* ── chip button ── */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .3rem .75rem;
      font-size: .8125rem;
      font-weight: 600;
      border-radius: 9999px;
      border: 1.5px solid;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
      cursor: pointer;
      line-height: 1.4
    }

    .chip-off {
      border-color: rgb(163 163 163/.6);
      color: rgb(64 64 64);
      background: transparent
    }

    .dark .chip-off {
      border-color: rgb(115 115 115/.5);
      color: rgb(212 212 212)
    }

    .chip-on {
      background: #0a0a0a;
      border-color: #0a0a0a;
      color: #fff
    }

    .dark .chip-on {
      background: #fafaf9;
      border-color: #fafaf9;
      color: #0a0a0a
    }

    @media(max-width:639px) {
      .chip {
        padding: .25rem .625rem;
        font-size: .75rem
      }
    }

    /* ── hide scrollbar on tab nav ── */
    #desktop-nav {
      scrollbar-width: none;
      -ms-overflow-style: none
    }

    #desktop-nav::-webkit-scrollbar {
      display: none
    }

    /* ── heatmap ── */
    .heat {
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-template-rows: repeat(7, auto);
      grid-auto-flow: column;
      gap: var(--gap)
    }

    .heat-months {
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      gap: var(--gap);
      font-size: 11px;
      opacity: .65;
      margin-bottom: 4px;
      height: 14px
    }

    .heat-months span {
      white-space: nowrap;
      overflow: visible
    }

    .heat-wrap {
      overflow-x: auto;
      padding-bottom: 4px
    }

    .heat .cell {
      border-radius: 2px
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 3px;
      background: rgba(127, 127, 127, .18);
      outline-offset: 1px
    }

    .cell[data-tip]:hover {
      outline: 1px solid rgba(127, 127, 127, .7)
    }

    .lv1 {
      background: #d6f5de
    }

    .lv2 {
      background: #8fdca4
    }

    .lv3 {
      background: #3fb868
    }

    .lv4 {
      background: #17713b
    }

    /* ── popup slide ── */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(48px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes slideOut {
      to {
        opacity: 0;
        transform: translateX(-48px)
      }
    }

    .slide-in {
      animation: slideIn .38s cubic-bezier(.2, .8, .2, 1) both
    }

    .slide-out {
      animation: slideOut .22s ease-in both
    }

    @media (prefers-reduced-motion:reduce) {

      .slide-in,
      .slide-out {
        animation: none !important
      }
    }

    /* ── time fields ── */
    .time-field {
      cursor: pointer;
      background: rgba(47, 59, 255, .06) !important;
      border-color: rgba(47, 59, 255, .28) !important;
      transition: background .15s, border-color .15s, box-shadow .15s
    }

    .time-field:hover {
      background: rgba(47, 59, 255, .13) !important;
      border-color: #2f3bff !important
    }

    .time-field:focus {
      box-shadow: 0 0 0 3px rgba(47, 59, 255, .18)
    }

    .dark .time-field {
      background: rgba(139, 147, 255, .1) !important;
      border-color: rgba(139, 147, 255, .3) !important
    }

    .dark .time-field:hover {
      background: rgba(139, 147, 255, .2) !important;
      border-color: #8b93ff !important
    }

    .time-field::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: .65;
      padding: 4px;
      border-radius: 6px;
      transition: opacity .15s, background-color .15s
    }

    .time-field:hover::-webkit-calendar-picker-indicator {
      opacity: 1;
      background-color: rgba(47, 59, 255, .15)
    }

    /* ── tooltip ── */
    #tip {
      position: fixed;
      z-index: 80;
      pointer-events: none;
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1.35;
      background: #0a0a0a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      white-space: nowrap;
      display: none;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3)
    }

    #tip b {
      display: block;
      font-size: 13px
    }

    /* ── toast ── */
    #toast>div {
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .18)
    }

    /* ── habit/task row ── */
    .habit-row {
      display: flex;
      align-items: center;
      gap: .875rem;
      padding: .875rem 0;
      border-bottom: 1px solid
    }

    .habit-row:last-child {
      border-bottom: none
    }

    @media(max-width:639px) {
      .habit-row {
        gap: .75rem;
        padding: .75rem 0
      }
    }

    /* ── streak badge ── */
    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      font-size: .75rem;
      font-weight: 700;
      padding: .2rem .5rem;
      border-radius: 9999px;
      white-space: nowrap
    }

    .streak-badge.active {
      background: #eff0ff;
      color: #2f3bff
    }

    .dark .streak-badge.active {
      background: #1e2060;
      color: #8b93ff
    }

    .streak-badge.zero {
      color: rgb(0 0 0/.3)
    }

    .dark .streak-badge.zero {
      color: rgb(255 255 255/.3)
    }

    /* ── progress bar ── */
    .prog-bar {
      height: 6px;
      border-radius: 9999px;
      background: rgba(127, 127, 127, .18);
      overflow: hidden;
      margin-top: .5rem
    }

    .prog-fill {
      height: 100%;
      border-radius: 9999px;
      background: #2f3bff;
      transition: width .4s ease
    }

    /* ── check box ── */
    .check-box {
      flex-shrink: 0;
      width: 2.125rem;
      height: 2.125rem;
      border-radius: 8px;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, border-color .15s;
      cursor: pointer
    }

    .check-box.done {
      background: #2f3bff;
      border-color: #2f3bff;
      color: #fff
    }

    .check-box.undone {
      border-color: rgb(115 115 115/.6);
      color: transparent
    }

    .check-box.undone:hover {
      border-color: #2f3bff
    }

    /* ── section head ── */
    .sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 1.75rem;
      margin-bottom: .25rem
    }

    /* ── day nav button ── */
    .day-btn {
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 10px;
      border: 1.5px solid rgb(163 163 163/.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
      cursor: pointer;
      background: transparent
    }

    .day-btn:hover {
      background: #0a0a0a;
      color: #fff;
      border-color: #0a0a0a
    }

    .dark .day-btn {
      border-color: rgb(115 115 115/.4)
    }

    .dark .day-btn:hover {
      background: #fafaf9;
      color: #0a0a0a;
      border-color: #fafaf9
    }

    /* ── card ── */
    .card {
      border-radius: 12px;
      border: 1.5px solid;
      padding: 1rem
    }

    .card-border {
      border-color: rgb(163 163 163/.3)
    }

    .dark .card-border {
      border-color: rgb(64 64 64/.6)
    }

    /* ── sample banner ── */
    .sample-banner {
      border-radius: 10px;
      background: rgba(47 59 255/.06);
      border: 1.5px dashed rgba(47 59 255/.3);
      padding: .625rem .875rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-bottom: 1rem;
      font-size: .8125rem
    }

    .dark .sample-banner {
      background: rgba(139 147 255/.08);
      border-color: rgba(139 147 255/.3)
    }

    /* ── about / author ── */
    .author {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      color: #2f3bff;
      text-decoration: none;
      background: linear-gradient(currentColor, currentColor) 0 100%/0 2px no-repeat;
      transition: background-size .3s ease
    }

    .dark .author {
      color: #8b93ff
    }

    .author:hover,
    .author:focus-visible {
      background-size: 100% 2px
    }

    .author svg {
      transition: transform .25s ease
    }

    .author:hover svg,
    .author:focus-visible svg {
      transform: translate(2px, -2px)
    }

    .author .hint {
      position: absolute;
      right: 0;
      bottom: calc(100% + 10px);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      background: #2f3bff;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      border-radius: 6px;
      transition: opacity .2s ease
    }

    .author .hint::after {
      content: '';
      position: absolute;
      right: 16px;
      top: 100%;
      border: 5px solid transparent;
      border-top-color: #2f3bff
    }

    .author:hover .hint,
    .author:focus-visible .hint {
      opacity: 1;
      animation: nudge 1.1s ease-in-out infinite
    }

    @keyframes nudge {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-3px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }

      .author .hint {
        animation: none !important
      }
    }
  </style>
</head>

<body class="bg-stone-50 text-neutral-950 dark:bg-neutral-950 dark:text-stone-100 min-h-screen">
  <div id="app" class="max-w-2xl mx-auto px-4 pb-32 md:pb-20"></div>
  <nav id="mobile-nav" aria-label="Main navigation"
    class="fixed bottom-0 inset-x-0 z-40 bg-stone-50/95 dark:bg-neutral-950/95 border-t border-neutral-200 dark:border-neutral-800 backdrop-blur-md"
    style="padding-bottom:env(safe-area-inset-bottom)"></nav>
  <div id="modal"></div>
  <div id="modal2"></div>
  <div id="tip" role="tooltip"></div>
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[70] md:bottom-6 pointer-events-none"></div>
  <script>
    const APP_VERSION = '0.0.1', KEY = 'be-discipline-v1', DEFCATS = [['Health', '#16a34a'], ['Study', '#2f3bff'], ['Work', '#f59e0b'], ['Mindset', '#a855f7']], PALETTE = ['#16a34a', '#2f3bff', '#f59e0b', '#a855f7', '#ef4444', '#06b6d4', '#ec4899', '#64748b'], DAYS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const $ = s => document.querySelector(s);
    const logo = (c, w = 2) => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad = n => String(n).padStart(2, '0');
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const tmOk = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(v) ? v : '', FMODES = ['timer', 'stopwatch', 'pomodoro'];
    const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d) };
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
    const uid = () => Math.random().toString(36).slice(2, 10);
    let S, view = 'today', filter = 'All', todayK = key(new Date()), viewK = todayK, formType = 'habit', anaK = todayK, pieBy = 'method';

    /* ---------- storage ---------- */
    function seed() {
      const t = new Date(), defs = [['Morning workout', 'Health', [1, 3, 5], '30 min, no phone'], ['Read 20 pages', 'Study', [], ''], ['Deep work block', 'Work', [1, 2, 3, 4, 5], '90 min, one task'], ['Meditate', 'Mindset', [], '']];
      const habits = defs.map(([name, cat, days, notes]) => ({ id: uid(), name, cat, days, notes, created: key(addDays(t, -24)), sample: true }));
      const logs = {};
      for (let i = 24; i >= 1; i--) {
        const d = addDays(t, -i); habits.forEach((h, j) => {
          if ((!h.days.length || h.days.includes(d.getDay())) && ((i * 7 + j * 13) % 10) < 7) (logs[key(d)] ??= []).push(h.id)
        })
      }
      return { v: 1, habits, logs, prefs: { theme: 'light' }, sampleActive: true };
    }
    function valid(o) {
      return o && typeof o === 'object' && Array.isArray(o.habits) && o.logs && typeof o.logs === 'object' && !Array.isArray(o.logs) && o.prefs && typeof o.prefs === 'object'
        && o.habits.every(h => h && typeof h.id === 'string' && typeof h.name === 'string' && Array.isArray(h.days) && typeof h.created === 'string')
        && Object.values(o.logs).every(Array.isArray) && (o.tasks === undefined || Array.isArray(o.tasks)) && (o.sessions === undefined || Array.isArray(o.sessions))
    }
    function load() {
      try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); if (valid(o)) return o } else return seed() } catch (e) { }
      toast('Saved data was unreadable and has been reset.', 'err'); return { v: 1, habits: [], logs: {}, prefs: { theme: 'light' }, sampleActive: false }
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) { toast('Could not save: browser storage is full or blocked.', 'err') } }

    /* ---------- logic ---------- */
    const sched = (h, d) => key(d) >= h.created && (!h.until || key(d) <= h.until) && (!h.days.length || h.days.includes(d.getDay()));
    const done = (h, d) => (S.logs[key(d)] || []).includes(h.id);
    function streak(h, endK = todayK) {
      let d = fromKey(endK < todayK ? endK : todayK), n = 0;
      if (sched(h, d) && !done(h, d)) d = addDays(d, -1);
      for (let i = 0; i < 4000 && key(d) >= h.created; i++, d = addDays(d, -1)) { if (!sched(h, d)) continue; if (done(h, d)) n++; else break } return n
    }
    function history(h) { // chronological rows with running streak
      const rows = []; let cur = 0, best = 0, done_ = 0, total = 0;
      for (let d = fromKey(h.created); key(d) <= todayK; d = addDays(d, 1)) {
        if (!sched(h, d)) continue; const ok = done(h, d); total++;
        if (ok) { cur++; done_++; best = Math.max(best, cur) } else if (key(d) !== todayK) cur = 0;
        rows.push({ date: key(d), ok, streak: ok ? cur : 0 })
      }
      return { rows, best, done: done_, total }
    }
    function toggle(id) { if (viewK > todayK) return toast('You can tick this off once the day arrives.', 'err'); const l = (S.logs[viewK] ??= []); const i = l.indexOf(id); i < 0 ? l.push(id) : l.splice(i, 1); if (!l.length) delete S.logs[viewK]; save(); render() }
    function toggleTask(id) { const t = S.tasks.find(x => x.id === id); if (!t) return; if (t.date > todayK) return toast('You can tick this off once the day arrives.', 'err'); t.done = !t.done; save(); render() }
    function delHabit(id) { const h = S.habits.find(x => x.id === id); if (h) confirmBox('Delete habit?', `“${h.name}” and all of its history will be permanently removed.`, () => { removeHabit(id); toast('Habit deleted.') }) }
    function delTask(id) { const t = S.tasks.find(x => x.id === id); if (t) confirmBox('Delete task?', `“${t.name}” will be permanently removed.`, () => { S.tasks = S.tasks.filter(x => x.id !== id); save(); render(); toast('Task deleted.') }) }
    function toast(msg, type = 'ok', ms = 3500) { const t = $('#toast'); t.innerHTML = `<div class="px-4 py-2.5 text-sm font-medium shadow-lg ${type === 'err' ? 'bg-red-600 text-white' : 'bg-neutral-950 text-white dark:bg-white dark:text-neutral-950'}">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => t.innerHTML = '', ms) }
    function applyTheme() { document.documentElement.classList.toggle('dark', S.prefs.theme === 'dark') }
    function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000) }

    /* ---------- modal ---------- */
    const btn = 'px-4 py-2 text-sm font-semibold rounded-xl border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-200/50 dark:hover:bg-neutral-800 transition-colors';
    const btnP = 'px-4 py-2 text-sm font-semibold rounded-xl bg-accent text-white hover:opacity-90 transition-opacity';
    function modal(html, raw = false) {
      formSnap = formSnapFn = formSaveFn = null;
      $('#modal').innerHTML = `<div class="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm" onclick="if(event.target===this)dismissModal()"><div role="dialog" aria-modal="true" class="bg-stone-50 dark:bg-neutral-900 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl ${raw ? 'max-h-[92dvh] sm:max-h-[88vh] flex flex-col overflow-hidden' : 'p-6 max-h-[90vh] overflow-auto'}">${html}</div></div>`;
      lucide.createIcons();
    }
    function closeModal() { formSnap = formSnapFn = formSaveFn = null; $('#modal').innerHTML = '' }
    let appPopupOpen = false;
    function closePop() {
      if (appPopupOpen) { appPopupOpen = false; try { localStorage.setItem('be-discipline-apk-prompt-v1', '1') } catch (e) { } }
      popSticky = false; $('#modal2').innerHTML = ''
    }
    function checkAppPopup() {
      try { if (localStorage.getItem('be-discipline-apk-prompt-v1')) return showWelcome(false) } catch (e) { }
      appPopupOpen = true;
      pop(`<div class="flex items-start justify-between gap-3 mb-3">
        <div class="flex items-center gap-3">
          <span class="w-10 h-10 bg-[#15803d] text-white rounded-xl flex items-center justify-center shrink-0"><i data-lucide="smartphone" class="w-5 h-5"></i></span>
          <div>
            <h2 class="text-lg font-bold leading-tight">Android App Available</h2>
            <p class="text-xs opacity-60 mt-0.5">Be Discipline for Android</p>

      if (P.fin) P.idx = 0; P.idx = Math.min(P.idx, buildPlan(P.cfg).length - 1); P.fin = false; P.run = false; P.left = stepSecs(P); save(); render()
    }
    function pomoAuto(v) { TM().pomo.cfg.auto = v; save() }
    function pomoReset() { const P = TM().pomo; P.run = false; P.left = stepSecs(P); save(); render() }
    function pomoRestart() { const P = TM().pomo; P.acc = 0; P.began = 0; P.idx = 0; P.fin = false; P.run = false; P.left = stepSecs(P); save(); render() }
    function pomoNext(finished) {
      const P = TM().pomo, plan = buildPlan(P.cfg);
      if (plan[P.idx] === 'focus') P.acc += finished ? P.cfg.focus * 60 : Math.max(0, stepSecs(P) - remain(P));
      if (finished && plan[P.idx] === 'focus') P.done++;
      if (P.idx >= plan.length - 1) { P.fin = true; P.run = false; P.left = 0; save(); render(); askSave('pomodoro', P.acc, P.began, pomoRestart); return }
      P.idx++; P.left = stepSecs(P); P.run = false;
      if (finished && P.cfg.auto) { P.run = true; P.end = Date.now() + P.left * 1000 }
      save(); render()
    }
    function swToggle() { const w = TM().sw; unlockAudio(); if (w.run) { w.el = Date.now() - w.start; w.run = false } else { if (!w.el) w.began = Date.now(); w.start = Date.now() - w.el; w.run = true } save(); render() }
    function swLap() { const w = TM().sw; if (!w.run) return; w.laps.push(Date.now() - w.start); save(); render() }
    function swReset() { const w = TM().sw; w.run = false; w.el = 0; w.laps = []; w.began = 0; save(); render() }
    function tick() {
      const t = TM(), set = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== v) e.textContent = v };
      const tm = t.timer, tr = remain(tm);
      if (tm.run && tr <= 0) { tm.run = false; tm.left = 0; save(); beep(); render(); askSave('timer', tm.dur, tm.began, resetTimer) }
      set('tm-timer', fmt(tr));
      const P = t.pomo, pr = remain(P);
      if (P.run && !P.fin && pr <= 0) { const pl = buildPlan(P.cfg), m = pl[P.idx], last = P.idx >= pl.length - 1; beep(); toast(last ? 'All sessions complete. Well done.' : m === 'focus' ? 'Focus session complete. Break time.' : 'Break over. Back to focus.'); pomoNext(true); return }
      set('tm-pomo', fmt(pr));
      const bar = document.getElementById('pomo-bar'); if (bar) bar.style.width = (P.fin ? 100 : 100 - pr / stepSecs(P) * 100) + '%';
      const w = t.sw; set('tm-sw', fmtMs(w.run ? Date.now() - w.start : w.el));
      document.title = P.run ? `${fmt(pr)} · ${curMode(P) === 'focus' ? 'Focus' : 'Break'}` : tm.run ? `${fmt(tr)} · Timer` : 'Be Discipline'
    }
    /* ---------- saved study sessions ---------- */
    const MODES = { timer: 'Timer', stopwatch: 'Stopwatch', pomodoro: 'Pomodoro' }, MCOL = { pomodoro: '#15803d', stopwatch: '#2f3bff', timer: '#f59e0b' };
    const defName = ms => { const h = new Date(ms).getHours(); return (h >= 5 && h < 12 ? 'Morning' : h >= 12 && h < 17 ? 'Afternoon' : h >= 17 && h < 21 ? 'Evening' : 'Night') + ' session' };
    const fmtDur = x => { x = Math.round(x); const h = Math.floor(x / 3600), m = Math.floor(x % 3600 / 60); return h ? `${h}h ${m}m` : m >= 10 ? `${m}m` : m ? `${m}m ${x % 60}s` : `${x}s` };
    const clock = ms => new Date(ms).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    let pending = null;
    function askSave(mode, sec, began, after) {
      sec = Math.round(sec);
      if (sec < 1) { if (after) after(); return }
      began = began || Date.now() - sec * 1000; pending = { mode, sec, began, after };
      pop(`<h2 class="text-xl font-bold mb-1">Save this session?</h2>
  <p class="text-sm opacity-60 mb-5">${MODES[mode]}, ${fmtDur(sec)}, started ${clock(began)}</p>
  <label class="block text-sm font-medium mb-1" for="sn">Session name</label>
  <input id="sn" maxlength="40" placeholder="${defName(began)}" class="w-full mb-4 px-3 py-2.5 bg-transparent border border-neutral-400 dark:border-neutral-600">
  <label class="block text-sm font-medium mb-1" for="sno">Notes (optional)</label>
  <textarea id="sno" rows="3" placeholder="What did you study?" class="w-full mb-5 px-3 py-2.5 bg-transparent border border-neutral-400 dark:border-neutral-600"></textarea>
  <div class="flex gap-2 justify-end"><button class="${btn}" onclick="discardSession()">Discard</button><button class="${btnP}" onclick="saveSession()">Save session</button></div>`, true);
      if (activePlan) $('#sn').value = activePlan.name;
      $('#sn').focus()
    }
    function saveSession() {
      const p = pending; if (!p) return; pending = null; const plan = activePlan; activePlan = null;
      S.sessions.push({ id: uid(), name: $('#sn').value.trim() || defName(p.began), notes: $('#sno').value.trim(), start: p.began, dur: p.sec, mode: p.mode, date: key(new Date(p.began)) });
      let msg = 'Session saved.';
      if (plan) {
        const x = (plan.kind === 'task' ? S.tasks : S.habits).find(y => y.id === plan.id);
        if (x) { if (plan.kind === 'task') x.done = true; else { const l = (S.logs[plan.k] ??= []); if (!l.includes(x.id)) l.push(x.id) } msg = `Session saved. “${x.name}” marked as done.` }
      }
      anaK = key(new Date(p.began)); save(); closePop(); if (p.after) p.after(); toast(msg)
    }
    function discardSession() { const p = pending; pending = null; activePlan = null; closePop(); if (p && p.after) p.after(); toast('Session discarded.') }
    const none = () => toast('Nothing to save yet. Start first.', 'err');
    function timerStop() { const t = TM().timer, el = t.dur - remain(t); if (el < 1) return none(); t.left = remain(t); t.run = false; save(); askSave('timer', el, t.began, resetTimer) }
    function swStop() { const w = TM().sw, el = (w.run ? Date.now() - w.start : w.el) / 1000; if (el < 1) return none(); w.el = Math.round(el * 1000); w.run = false; save(); askSave('stopwatch', el, w.began, swReset) }
    function pomoStop() { const P = TM().pomo; if (!P.began && !P.acc) return none(); if (curMode(P) === 'focus' && !P.fin) P.acc += Math.max(0, stepSecs(P) - remain(P)); P.run = false; save(); askSave('pomodoro', P.acc, P.began, pomoRestart) }
    function anaGo(n) { anaK = key(addDays(fromKey(anaK), n)); render() }
    function setPie(v) { pieBy = v; render() }
    function delSession(id) { const x = S.sessions.find(y => y.id === id); if (x) confirmBox('Delete session?', `“${x.name}” (${fmtDur(x.dur)}) will be permanently removed.`, () => { S.sessions = S.sessions.filter(y => y.id !== id); save(); render(); toast('Session deleted.') }) }
    function studyStats() {
      const day = S.sessions.filter(x => x.date === anaK).sort((a, b) => a.start - b.start), total = day.reduce((a, x) => a + x.dur, 0), byM = pieBy === 'method', g = {};
      day.forEach(x => { const k = byM ? x.mode : x.name; (g[k] ??= { k, dur: 0 }).dur += x.dur });
      const items = Object.values(g).sort((a, b) => b.dur - a.dur).map((x, i) => ({ ...x, label: byM ? MODES[x.k] : x.k, color: byM ? MCOL[x.k] : PALETTE[i % PALETTE.length], pct: x.dur / total * 100 }));
      let cum = 0;
      const slices = items.map(it => {
        const tip = esc(`<b>${esc(it.label)}</b>${fmtDur(it.dur)}, ${Math.round(it.pct)}%`);
        const c = `<circle cx="16" cy="16" r="8" fill="none" stroke="${it.color}" stroke-width="16" pathLength="100" stroke-dasharray="${it.pct} ${100 - it.pct}" stroke-dashoffset="${-cum}" transform="rotate(-90 16 16)" data-tip="${tip}"/>`; cum += it.pct; return c
      }).join('');
      const nb = 'shrink-0 w-9 h-9 rounded-xl border border-neutral-300 dark:border-neutral-700 flex items-center justify-center hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors';
      const seg = (v, l) => `<button onclick="setPie('${v}')" aria-pressed="${pieBy === v}" class="px-3 py-1.5 text-xs font-semibold rounded-full border transition-colors ${pieBy === v ? 'bg-neutral-950 text-white border-neutral-950 dark:bg-stone-100 dark:text-neutral-950 dark:border-stone-100' : 'border-neutral-300 dark:border-neutral-700 opacity-60 hover:opacity-100'}">${l}</button>`;
      return `<h2 class="mt-10 text-xl sm:text-2xl font-bold tracking-tight">Focus time</h2>
  <div class="flex items-center gap-2.5 mt-4">
    <button onclick="anaGo(-1)" aria-label="Previous day" class="${nb}"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
    <div class="flex-1 text-center"><p class="font-bold text-sm">${relLabel(anaK)}</p><p class="text-xs opacity-50">${total ? fmtDur(total) + ' focused' : 'No focus time logged'}</p></div>
    <button onclick="anaGo(1)" aria-label="Next day" class="${nb}"><i data-lucide="chevron-right" class="w-4 h-4"></i></button></div>
  <div class="flex items-center justify-center gap-3 mt-2.5 text-xs font-semibold">${anaK === todayK ? '' : `<button class="text-accent dark:text-blue-400 hover:underline" onclick="anaK=todayK;render()">↩ Today</button>`}<button class="flex items-center gap-1 opacity-50 hover:opacity-80" onclick="openCal(anaK,k=>{anaK=k;render()})"><i data-lucide="calendar" class="w-3.5 h-3.5"></i>&nbsp;Pick date</button></div>
  <div class="flex justify-center gap-2 mt-4" role="group" aria-label="Group the chart">${seg('method', 'By method')}${seg('session', 'By session')}</div>
  <div class="mt-5 flex flex-col sm:flex-row items-center justify-center gap-6">
    <svg viewBox="0 0 32 32" class="w-36 h-36 sm:w-44 sm:h-44 shrink-0" role="img" aria-label="Focus time split">${items.length ? slices : '<circle cx="16" cy="16" r="16" fill="rgba(127,127,127,.18)"/>'}</svg>
    ${items.length ? `<ul class="w-full space-y-2">${items.map(it => `<li class="flex items-center gap-2.5 text-sm"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${it.color}"></span><span class="flex-1 truncate">${esc(it.label)}</span><span class="font-bold">${fmtDur(it.dur)}</span><span class="opacity-40 text-xs w-9 text-right">${Math.round(it.pct)}%</span></li>`).join('')}</ul>` : ''}</div>
  ${day.length ? `<ul class="mt-5 card card-border divide-y divide-neutral-200 dark:divide-neutral-800">${day.map(x => `<li class="flex items-start gap-3 py-3.5 px-1">
    <span class="mt-1 w-2 h-2 rounded-full shrink-0" style="background:${MCOL[x.mode]}"></span>
    <div class="min-w-0 flex-1"><p class="font-semibold text-sm truncate">${esc(x.name)}</p><p class="text-xs opacity-50">${MODES[x.mode]} · ${clock(x.start)}</p>${x.notes ? `<p class="text-xs mt-1 opacity-70 whitespace-pre-line break-words">${esc(x.notes)}</p>` : ''}</div>
    <span class="font-bold text-sm whitespace-nowrap">${fmtDur(x.dur)}</span><button onclick="sessionForm('${x.id}')" aria-label="Edit session" class="p-1.5 rounded-lg opacity-30 hover:opacity-80 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-all"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button><button onclick="delSession('${x.id}')" aria-label="Delete session" class="p-1.5 rounded-lg opacity-30 hover:opacity-80 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-950 transition-all"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button></li>`).join('')}</ul>`
          : `<p class="mt-5 py-6 text-sm opacity-50 text-center">No sessions today. Use the 'Focus' tab to log time.</p>`}`
    }

    function studyView() {
      const t = TM(), subs = [['pomodoro', 'Pomodoro'], ['timer', 'Timer'], ['stopwatch', 'Stopwatch']];
      const big = (id, v) => `<p id="${id}" class="text-6xl sm:text-8xl font-bold tracking-tight tabular-nums text-center py-8 sm:py-10" aria-live="off">${v}</p>`;
      const inp = 'w-full mt-1 px-3 py-2.5 text-sm bg-transparent border border-neutral-300 dark:border-neutral-700 rounded-lg disabled:opacity-40 focus:outline-none focus:border-accent';
      let body = '';
      if (sub === 'pomodoro') {
        const P = t.pomo, c = P.cfg, plan = buildPlan(c), mode = curMode(P), fn = plan.slice(0, P.idx + 1).filter(m => m === 'focus').length;
        const label = P.fin ? 'All sessions complete' : mode === 'focus' ? `Focus: session ${fn} of ${c.sessions}` : mode === 'short' ? 'Short break' : 'Long break';
        const mins = plan.reduce((a, m) => a + c[m], 0), tot = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
        const names = { focus: 'Focus', short: 'Short break', long: 'Long break' };
        body = `<div class="card card-border"><p class="text-center text-xs font-bold uppercase tracking-widest opacity-50">${label}</p>
    ${big('tm-pomo', fmt(remain(P)))}
    <div class="h-1.5 rounded-full bg-neutral-200 dark:bg-neutral-800"><div id="pomo-bar" class="h-full rounded-full bg-accent" style="width:0"></div></div>
    <div class="flex flex-wrap gap-2 justify-center mt-6">${P.fin ? `<button class="${btnP}" onclick="pomoRestart()">Start again</button>` : `<button class="${btnP}" onclick="startStop(TM().pomo,()=>stepSecs(TM().pomo))">${P.run ? 'Pause' : 'Start'}</button><button class="${btn}" onclick="pomoReset()">Reset</button><button class="${btn}" onclick="pomoNext(false)">Skip</button><button class="${btn}" onclick="pomoStop()">Stop</button>`}</div>
    <p class="text-center text-xs opacity-50 mt-4">${P.done} focus session${P.done === 1 ? '' : 's'} done today &middot; ${P.fin ? 'All done! 🎉' : plan[P.idx + 1] ? `Up next: ${names[plan[P.idx + 1]]}, ${c[plan[P.idx + 1]]} min` : 'Last step'}</p>
    <p class="text-center text-[11px] opacity-40 mt-2">Skip jumps to the next step. Stop ends the session so you can save it.</p>
    <ol class="mt-4 flex flex-wrap gap-1.5 justify-center" aria-label="Your plan">${(() => {
            let fc = 0; return plan.map((m, i) => {
              const label = m === 'focus' ? `F${++fc}` : m === 'short' ? 'S' : 'L', isDone = P.fin || i < P.idx, cur = !P.fin && i === P.idx;
              return `<li class="flex items-center gap-1 px-2.5 py-1.5 text-xs rounded-full border ${cur ? 'bg-neutral-950 text-white border-neutral-950 dark:bg-stone-100 dark:text-neutral-950 dark:border-stone-100 font-bold' : 'border-neutral-200 dark:border-neutral-700'} ${isDone ? 'opacity-40' : ''}">${isDone ? '✓ ' : ''}<span class="${isDone ? 'line-through' : ''}">${label}</span></li>`
            }).join('')
          })()}</ol>
    <p class="text-center text-xs opacity-40 mt-3">${c.sessions} focus sessions · ${plan.includes('long') ? `long break every ${c.longEvery}` : 'short breaks only'} · Total ${tot}</p>
    </div>
    <h3 class="font-bold text-sm mt-6 mb-3">Settings</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${[['focus', 'Focus (min)'], ['short', 'Short break (min)'], ['long', 'Long break (min)'], ['sessions', 'Sessions'], ['longEvery', 'Long break every']].map(([k, l]) => `<label class="text-xs font-semibold opacity-70">${l}<input type="number" min="${k === 'longEvery' ? 0 : 1}" value="${c[k]}" ${P.run ? 'disabled' : ''} onchange="pomoCfg('${k}',this.value)" class="${inp}"></label>`).join('')}
    <label class="text-xs font-semibold opacity-70 flex items-end gap-2 pb-2.5"><input type="checkbox" ${c.auto ? 'checked' : ''} onchange="pomoAuto(this.checked)" class="w-4 h-4 accent-[#2f3bff]">Auto-start</label></div>
    ${P.run ? '<p class="text-xs opacity-40 mt-2">Pause to change settings.</p>' : ''}`
      }
      if (sub === 'timer') {
        const T_ = t.timer;
        body = `${big('tm-timer', fmt(remain(T_)))}
    <div class="flex flex-wrap gap-2 justify-center"><button class="${btnP}" onclick="startStop(TM().timer,()=>TM().timer.dur)">${T_.run ? 'Pause' : 'Start'}</button><button class="${btn}" onclick="timerStop()">Stop</button><button class="${btn}" onclick="resetTimer()">Reset</button></div>
    <p class="text-center text-[11px] opacity-40 mt-3">Choose a length below, then press Start. Stop ends it early so you can save it.</p>
    <div class="flex flex-wrap gap-2 justify-center mt-4">${[15, 30, 60].map(m => `<button onclick="setTimerDur(${m})" class="px-3 py-1.5 text-xs font-semibold rounded-full border transition-colors ${T_.dur === m * 60 ? 'border-accent text-accent dark:text-blue-400 bg-blue-50 dark:bg-blue-950' : 'border-neutral-300 dark:border-neutral-700 hover:border-accent'}">${m}m</button>`).join('')}</div>
    <label class="block text-xs font-medium opacity-60 mt-5 max-w-[8rem] mx-auto">Custom (min)<input type="number" min="1" max="999" value="${Math.round(T_.dur / 60)}" onchange="setTimerDur(this.value)" class="w-full mt-1 px-3 py-2 text-sm bg-transparent border border-neutral-300 dark:border-neutral-700 rounded-lg focus:outline-none focus:border-accent"></label>`
      }
      if (sub === 'stopwatch') {
        const w = t.sw;
        body = `${big('tm-sw', fmtMs(w.run ? Date.now() - w.start : w.el))}
    <div class="flex flex-wrap gap-2 justify-center"><button class="${btnP}" onclick="swToggle()">${w.run ? 'Pause' : w.el ? 'Resume' : 'Start'}</button><button class="${btn} ${w.run ? '' : 'opacity-40'}" onclick="swLap()">Lap</button><button class="${btn}" onclick="swStop()">Stop</button><button class="${btn}" onclick="swReset()">Reset</button></div>
    <p class="text-center text-[11px] opacity-40 mt-3">Lap marks a split time. Stop ends it so you can save the session.</p>
    ${w.laps.length ? `<ol class="mt-6 card card-border divide-y divide-neutral-200 dark:divide-neutral-800 tabular-nums">${w.laps.map((l, i) => `<li class="flex justify-between py-2.5 px-1 text-sm"><span class="opacity-50">Lap ${i + 1}</span><span class="opacity-40 text-xs">+${fmtMs(l - (w.laps[i - 1] || 0))}</span><span class="font-bold">${fmtMs(l)}</span></li>`).reverse().join('')}</ol>` : ''}`
      }
      return `<h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Focus</h1>
  <p class="text-xs opacity-60 mt-1">Run a timer, stopwatch or Pomodoro, then save the session to track your focus time.</p>
  ${plannedCard()}
  <div class="flex gap-1 mt-4 bg-neutral-100 dark:bg-neutral-900 rounded-xl p-1">${subs.map(([id, l]) => `<button onclick="sub='${id}';render()" class="flex-1 py-1.5 text-xs sm:text-sm font-semibold rounded-lg transition-colors ${sub === id ? 'bg-white dark:bg-neutral-800 shadow-sm' : 'opacity-50 hover:opacity-80'}">${l}</button>`).join('')}</div>
  <div class="mt-5">${sub === 'pomodoro' ? body : `<div class="card card-border px-5 pb-6 pt-1">${body}</div>`}</div>`
    }

    /* ---------- shell ---------- */
    function render() {
      const tabs = [['today', 'check-square', relLabel(viewK)], ['study', 'target', 'Focus'], ['stats', 'bar-chart-3', 'Insights'], ['settings', 'settings', 'Settings']];
      const themeBtn = `<button onclick="S.prefs.theme=S.prefs.theme==='dark'?'light':'dark';save();applyTheme();render()" aria-label="Toggle light and dark mode" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-neutral-200 dark:hover:bg-neutral-800 transition-colors"><i data-lucide="${S.prefs.theme === 'dark' ? 'sun' : 'moon'}" class="w-5 h-5"></i></button>`;
      $('#app').innerHTML = `<header class="flex items-center justify-between py-4 sm:py-5">
    <span class="font-bold text-base sm:text-lg tracking-tight flex items-center gap-2"><span class="w-6 h-6 rounded-md bg-[#15803d] text-white flex items-center justify-center">${logo('w-3.5 h-3.5')}</span>Be Discipline</span>
    ${themeBtn}</header>
  <nav id="desktop-nav" class="hidden md:flex overflow-x-auto border-b border-neutral-200 dark:border-neutral-800 mb-8">${tabs.map(([id, ic, l]) => `<button onclick="view='${id}';setSub=null;render()" class="flex items-center gap-2 px-4 py-3 text-sm font-semibold -mb-px border-b-2 transition-colors ${view === id ? 'border-accent text-accent' : 'border-transparent opacity-50 hover:opacity-80'}"><i data-lucide="${ic}" class="w-4 h-4"></i>${l}</button>`).join('')}</nav>
  <main>${view === 'today' ? todayView() : view === 'study' ? studyView() : view === 'stats' ? statsView() : settingsView()}</main>`;
      /* populate mobile bottom nav */
      const mn = document.getElementById('mobile-nav');
      if (mn) { mn.innerHTML = `<div class="flex w-full">${tabs.map(([id, ic, l]) => `<button onclick="view='${id}';setSub=null;render()" aria-label="${l}" aria-current="${view === id ? 'page' : 'false'}" class="flex-1 flex flex-col items-center justify-center pt-2 pb-1.5 gap-0.5 text-[10px] font-semibold transition-colors ${view === id ? 'text-accent dark:text-blue-400' : 'text-neutral-400 dark:text-neutral-500'}"><i data-lucide="${ic}" class="w-5 h-5 mb-0.5 ${view === id ? '' : ''}"></i><span>${l}</span></button>`).join('')}</div>`; }
      lucide.createIcons()
    }

    (() => {
      const tip = document.getElementById('tip');
      const show = e => {
        const c = e.target.closest && e.target.closest('[data-tip]'); if (!c) return; tip.innerHTML = c.dataset.tip; tip.style.display = 'block';
        const r = c.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
        tip.style.left = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + 'px'; tip.style.top = (r.top > h + 12 ? r.top - h - 8 : r.bottom + 8) + 'px'
      };
      const hide = () => tip.style.display = 'none';
      document.addEventListener('mouseover', show); document.addEventListener('focusin', show); document.addEventListener('click', show);
      document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('[data-tip]')) hide() });
      document.addEventListener('focusout', hide); document.addEventListener('scroll', hide, true)
    })();
    S = normalize(load()); save(); applyTheme(); render(); checkAppPopup(); setInterval(tick, 250); setInterval(checkReminders, 15000); checkReminders();
    // Midnight rollover: re-render when the local date changes.
    setInterval(() => { const k = key(new Date()); if (k !== todayK) { if (viewK === todayK) viewK = k; if (anaK === todayK) anaK = k; todayK = k; render() } }, 30000);
    document.addEventListener('visibilitychange', () => { const k = key(new Date()); if (k !== todayK) { if (viewK === todayK) viewK = k; if (anaK === todayK) anaK = k; todayK = k; render() } });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => { });
    }
  </script>
</body>
